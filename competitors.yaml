# Competitor watchlist.
#
# `bucket` drives Slack routing and the fit_score prior in Clay:
#   overlay      - overlay/widget vendor. Core competitor. A merchant complaining
#                  here is the single best lead TestParty can get.
#   code-fix     - source-code remediation. Direct positional competitor.
#   scanner      - audit/scan/monitoring only. Adjacent.
#   alt-text     - image alt-text SEO tools. Weak signal, high volume. Off by default.
#   gdpr-bundle  - cookie/GDPR apps that bundle an a11y widget. Weak signal.
#
# `enabled: false` means "resolve and validate the handle, but don't alert on it."
# Handles verified against apps.shopify.com on 2026-07-29.

defaults:
  max_rating: 3        # flag reviews at or below this
  pages: 1             # review pages to walk per rating level
                       # 1 is plenty: no monitored app has more than 4 negative
                       # reviews. Raise it if you enable the gdpr-bundle apps.

